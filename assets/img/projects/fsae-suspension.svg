<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Formula Student double wishbone suspension geometry with camber curve and data acquisition correlation">
  <defs>
    <linearGradient id="fsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#1d1a2d"/>
    </linearGradient>
    <pattern id="fsgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#26243a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#fsbg)"/>
  <rect width="1200" height="750" fill="url(#fsgrid)"/>

  <!-- header -->
  <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" fill="#f472b6" letter-spacing="3">FORMULA STUDENT · SUBSYSTEM LEAD</text>
  <text x="60" y="132" font-family="Georgia,serif" font-size="44" fill="#e2e8f0">Suspension &amp; Steering</text>
  <line x1="60" y1="158" x2="270" y2="158" stroke="#38bdf8" stroke-width="4"/>

  <!-- ground plane -->
  <line x1="90" y1="620" x2="640" y2="620" stroke="#4b5563" stroke-width="3"/>
  <g stroke="#374151" stroke-width="2">
    <line x1="110" y1="620" x2="94" y2="638"/><line x1="160" y1="620" x2="144" y2="638"/>
    <line x1="210" y1="620" x2="194" y2="638"/><line x1="260" y1="620" x2="244" y2="638"/>
    <line x1="310" y1="620" x2="294" y2="638"/><line x1="360" y1="620" x2="344" y2="638"/>
    <line x1="410" y1="620" x2="394" y2="638"/><line x1="460" y1="620" x2="444" y2="638"/>
    <line x1="510" y1="620" x2="494" y2="638"/><line x1="560" y1="620" x2="544" y2="638"/>
  </g>

  <!-- chassis reference -->
  <rect x="120" y="330" width="34" height="230" rx="6" fill="#2a2740" stroke="#6b7280" stroke-width="2"/>
  <text x="98" y="316" font-family="ui-monospace,monospace" font-size="17" fill="#9ca3af">chassis</text>

  <!-- tyre, slightly cambered -->
  <g transform="rotate(-5 480 500)">
    <rect x="424" y="392" width="112" height="216" rx="20" fill="#181726" stroke="#4b5563" stroke-width="4"/>
    <rect x="446" y="428" width="68" height="144" rx="12" fill="#2d2b42" stroke="#6b7280" stroke-width="3"/>
    <circle cx="480" cy="500" r="20" fill="#3f3d5c" stroke="#9ca3af" stroke-width="3"/>
  </g>

  <!-- upright -->
  <line x1="452" y1="428" x2="452" y2="572" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>

  <!-- upper wishbone -->
  <g stroke="#f472b6" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M154 396 L452 436"/>
    <path d="M154 348 L452 436"/>
  </g>
  <!-- lower wishbone -->
  <g stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M154 556 L452 566"/>
    <path d="M154 512 L452 566"/>
  </g>
  <!-- pushrod + damper -->
  <line x1="418" y1="558" x2="268" y2="384" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <g>
    <rect x="228" y="300" width="26" height="76" rx="6" fill="#4b5563" stroke="#d1d5db" stroke-width="2" transform="rotate(-28 241 338)"/>
  </g>
  <text x="188" y="286" font-family="ui-monospace,monospace" font-size="17" fill="#fbbf24">damper</text>

  <!-- pivot points -->
  <g fill="#111827" stroke="#e5e7eb" stroke-width="3">
    <circle cx="154" cy="396" r="8"/><circle cx="154" cy="348" r="8"/>
    <circle cx="154" cy="556" r="8"/><circle cx="154" cy="512" r="8"/>
    <circle cx="452" cy="436" r="9"/><circle cx="452" cy="566" r="9"/>
  </g>

  <!-- camber angle annotation -->
  <line x1="480" y1="600" x2="480" y2="360" stroke="#34d399" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="480" y1="600" x2="458" y2="362" stroke="#f87171" stroke-width="3"/>
  <path d="M480 420 a 180 180 0 0 0 -16 -2" fill="none" stroke="#f87171" stroke-width="3"/>
  <text x="504" y="392" font-family="ui-monospace,monospace" font-size="21" fill="#f87171">camber γ</text>

  <!-- instant centre -->
  <circle cx="612" cy="490" r="7" fill="#fbbf24"/>
  <path d="M452 436 L612 490 M452 566 L612 490" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 6" fill="none" opacity="0.7"/>
  <text x="562" y="470" font-family="ui-monospace,monospace" font-size="16" fill="#fbbf24">instant centre</text>

  <!-- right panel -->
  <g font-family="ui-monospace,monospace">
    <line x1="716" y1="196" x2="716" y2="640" stroke="#2f2b45" stroke-width="2"/>

    <!-- camber curve -->
    <text x="748" y="216" font-size="22" fill="#e2e8f0">camber vs. wheel travel</text>
    <line x1="756" y1="360" x2="1128" y2="360" stroke="#4b5563" stroke-width="2"/>
    <line x1="942" y1="248" x2="942" y2="392" stroke="#4b5563" stroke-width="2"/>
    <path d="M756 268 C 850 300, 900 342, 942 360 C 990 380, 1060 386, 1128 380" fill="none" stroke="#f472b6" stroke-width="4"/>
    <text x="748" y="412" font-size="15" fill="#64748b">bump ← → droop</text>

    <!-- DAQ correlation -->
    <text x="748" y="470" font-size="22" fill="#e2e8f0">DAQ vs. model correlation</text>
    <line x1="756" y1="612" x2="1128" y2="612" stroke="#4b5563" stroke-width="2"/>
    <path d="M756 592 L810 546 L864 566 L918 512 L972 534 L1026 496 L1080 514 L1128 488"
          fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M756 598 L810 556 L864 574 L918 524 L972 544 L1026 508 L1080 522 L1128 498"
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6"/>
    <g font-size="16">
      <rect x="756" y="628" width="22" height="5" fill="#38bdf8"/>
      <text x="786" y="638" fill="#94a3b8">track data</text>
      <rect x="900" y="628" width="22" height="5" fill="#fbbf24"/>
      <text x="930" y="638" fill="#94a3b8">vehicle model</text>
    </g>
  </g>

  <!-- footer chips -->
  <g font-family="ui-monospace,monospace" font-size="17">
    <rect x="60" y="676" width="176" height="34" rx="17" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="80" y="699" fill="#f472b6">vehicle dynamics</text>
    <rect x="250" y="676" width="128" height="34" rx="17" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="270" y="699" fill="#f472b6">12 eng.</text>
    <rect x="392" y="676" width="196" height="34" rx="17" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="412" y="699" fill="#f472b6">2nd Formula Bharat</text>
  </g>
</svg>
