<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Five degree of freedom package handling robotic arm with reachable workspace envelope and joint torque budget">
  <defs>
    <linearGradient id="pabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1626"/>
      <stop offset="100%" stop-color="#16233a"/>
    </linearGradient>
    <linearGradient id="palink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="ws" cx="0.16" cy="0.86" r="0.92">
      <stop offset="55%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="82%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.03"/>
    </radialGradient>
    <pattern id="pagrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1e2d47" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#pabg)"/>
  <rect width="1200" height="750" fill="url(#pagrid)"/>

  <!-- header -->
  <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" fill="#4ade80" letter-spacing="3">SOLIDWORKS · ROS 2 · MoveIt</text>
  <text x="60" y="132" font-family="Georgia,serif" font-size="44" fill="#e2e8f0">5-DOF Package Handling Arm</text>
  <line x1="60" y1="158" x2="270" y2="158" stroke="#fbbf24" stroke-width="4"/>

  <!-- workspace envelope -->
  <path d="M196 620 m -6 0 a 330 330 0 0 1 660 0" fill="url(#ws)"/>
  <path d="M190 620 a 330 330 0 0 1 660 0" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.75"/>
  <path d="M300 620 a 220 220 0 0 1 440 0" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 7" opacity="0.4"/>
  <text x="590" y="332" font-family="ui-monospace,monospace" font-size="20" fill="#4ade80">reach 700 mm</text>

  <!-- conveyor -->
  <rect x="640" y="592" width="470" height="16" rx="8" fill="#243550"/>
  <g fill="#1c2a42">
    <rect x="690" y="608" width="16" height="42"/><rect x="900" y="608" width="16" height="42"/><rect x="1060" y="608" width="16" height="42"/>
  </g>
  <g stroke="#334867" stroke-width="2">
    <line x1="670" y1="600" x2="670" y2="600"/>
  </g>

  <!-- paint cans on conveyor -->
  <g>
    <rect x="796" y="546" width="54" height="46" rx="4" fill="#1f3050" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="823" cy="546" rx="27" ry="8" fill="#2b4266" stroke="#64748b" stroke-width="2"/>
    <rect x="964" y="546" width="54" height="46" rx="4" fill="#1f3050" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="991" cy="546" rx="27" ry="8" fill="#2b4266" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- pallet target -->
  <rect x="120" y="620" width="150" height="12" fill="#3a2f1f" stroke="#7c6a45" stroke-width="2"/>
  <rect x="140" y="580" width="52" height="40" rx="3" fill="#1f3050" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="166" cy="580" rx="26" ry="7" fill="#2b4266" stroke="#64748b" stroke-width="2"/>

  <!-- base -->
  <path d="M336 620 h120 l-16 -50 h-88 z" fill="#334867"/>
  <rect x="356" y="546" width="80" height="26" rx="6" fill="#3d5478"/>

  <!-- arm links -->
  <g fill="none" stroke-linecap="round">
    <path d="M396 552 L396 424" stroke="#0b1120" stroke-width="36"/>
    <path d="M396 424 L534 352" stroke="#0b1120" stroke-width="32"/>
    <path d="M534 352 L664 396" stroke="#0b1120" stroke-width="28"/>
    <path d="M664 396 L724 470" stroke="#0b1120" stroke-width="24"/>

    <path d="M396 552 L396 424" stroke="url(#palink)" stroke-width="26"/>
    <path d="M396 424 L534 352" stroke="url(#palink)" stroke-width="24"/>
    <path d="M534 352 L664 396" stroke="url(#palink)" stroke-width="20"/>
    <path d="M664 396 L724 470" stroke="url(#palink)" stroke-width="15"/>
  </g>

  <!-- electromagnetic end effector -->
  <rect x="700" y="470" width="52" height="24" rx="5" fill="#fbbf24"/>
  <g stroke="#fde68a" stroke-width="3" fill="none">
    <path d="M710 496 q 6 14 0 22"/><path d="M726 496 q 6 14 0 22"/><path d="M742 496 q 6 14 0 22"/>
  </g>
  <text x="768" y="492" font-family="ui-monospace,monospace" font-size="19" fill="#fbbf24">electromagnetic EE</text>
  <text x="768" y="518" font-family="ui-monospace,monospace" font-size="17" fill="#94a3b8">3 kg payload</text>

  <!-- joints with angle labels -->
  <g>
    <circle cx="396" cy="552" r="18" fill="#16233a" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="396" cy="424" r="17" fill="#16233a" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="534" cy="352" r="16" fill="#16233a" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="664" cy="396" r="14" fill="#16233a" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="724" cy="470" r="12" fill="#16233a" stroke="#94a3b8" stroke-width="4"/>
  </g>
  <g font-family="ui-monospace,monospace" font-size="18" fill="#cbd5e1">
    <text x="352" y="586">θ₁</text><text x="348" y="418">θ₂</text><text x="518" y="322">θ₃</text><text x="678" y="376">θ₄</text><text x="736" y="452">θ₅</text>
  </g>

  <!-- pick and place arc -->
  <path d="M760 500 C 700 590, 400 640, 190 592" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="9 7" opacity="0.75"/>
  <path d="M196 596 l18 -8 l-4 16 z" fill="#fbbf24"/>

  <!-- right panel: joint torque budget -->
  <g font-family="ui-monospace,monospace">
    <text x="900" y="176" font-size="22" fill="#e2e8f0">joint torque budget</text>
    <g>
      <rect x="900" y="196" width="150" height="18" rx="4" fill="#22c55e" opacity="0.9"/>
      <text x="1060" y="211" font-size="16" fill="#94a3b8">τ₁</text>
      <rect x="900" y="224" width="196" height="18" rx="4" fill="#22c55e" opacity="0.75"/>
      <text x="1106" y="239" font-size="16" fill="#94a3b8">τ₂</text>
      <rect x="900" y="252" width="128" height="18" rx="4" fill="#22c55e" opacity="0.6"/>
      <text x="1038" y="267" font-size="16" fill="#94a3b8">τ₃</text>
      <rect x="900" y="280" width="76" height="18" rx="4" fill="#22c55e" opacity="0.45"/>
      <text x="986" y="295" font-size="16" fill="#94a3b8">τ₄</text>
      <rect x="900" y="308" width="44" height="18" rx="4" fill="#22c55e" opacity="0.35"/>
      <text x="954" y="323" font-size="16" fill="#94a3b8">τ₅</text>
    </g>
    <text x="900" y="360" font-size="16" fill="#64748b">payload + link mass + dynamic load</text>
  </g>

  <!-- footer chips -->
  <g font-family="ui-monospace,monospace" font-size="17">
    <rect x="60" y="676" width="200" height="34" rx="17" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="80" y="699" fill="#4ade80">inverse kinematics</text>
    <rect x="274" y="676" width="212" height="34" rx="17" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="294" y="699" fill="#4ade80">singularity avoidance</text>
    <rect x="500" y="676" width="118" height="34" rx="17" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="520" y="699" fill="#4ade80">Gazebo</text>
  </g>
</svg>
