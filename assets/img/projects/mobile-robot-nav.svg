<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Autonomous mobile robot with particle filter localization, RRT motion planning, and PID control">
  <defs>
    <linearGradient id="mrbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1522"/>
      <stop offset="100%" stop-color="#152436"/>
    </linearGradient>
    <radialGradient id="lidar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mrgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1b2b40" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#mrbg)"/>
  <rect width="1200" height="750" fill="url(#mrgrid)"/>

  <!-- header -->
  <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" fill="#34d399" letter-spacing="3">PARTICLE FILTER · RRT · PID</text>
  <text x="60" y="132" font-family="Georgia,serif" font-size="44" fill="#e2e8f0">Autonomous Mobile Robot</text>
  <line x1="60" y1="158" x2="270" y2="158" stroke="#fbbf24" stroke-width="4"/>

  <!-- occupancy map walls -->
  <g fill="#243550">
    <rect x="90" y="212" width="620" height="14"/>
    <rect x="90" y="212" width="14" height="420"/>
    <rect x="90" y="618" width="620" height="14"/>
    <rect x="696" y="212" width="14" height="180"/>
    <rect x="696" y="500" width="14" height="132"/>
    <rect x="240" y="300" width="150" height="14"/>
    <rect x="440" y="380" width="14" height="150"/>
    <rect x="300" y="500" width="130" height="14"/>
  </g>

  <!-- obstacle padding (inflation) -->
  <g fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 5" opacity="0.5">
    <rect x="230" y="290" width="170" height="34" rx="6"/>
    <rect x="430" y="370" width="34" height="170" rx="6"/>
    <rect x="290" y="490" width="150" height="34" rx="6"/>
  </g>
  <text x="470" y="352" font-family="ui-monospace,monospace" font-size="16" fill="#f87171">obstacle padding</text>

  <!-- LIDAR scan -->
  <circle cx="200" cy="420" r="132" fill="url(#lidar)"/>
  <g stroke="#f472b6" stroke-width="1.6" opacity="0.62">
    <line x1="200" y1="420" x2="200" y2="316"/><line x1="200" y1="420" x2="266" y2="330"/>
    <line x1="200" y1="420" x2="322" y2="386"/><line x1="200" y1="420" x2="330" y2="440"/>
    <line x1="200" y1="420" x2="300" y2="496"/><line x1="200" y1="420" x2="240" y2="536"/>
    <line x1="200" y1="420" x2="160" y2="540"/><line x1="200" y1="420" x2="112" y2="470"/>
    <line x1="200" y1="420" x2="112" y2="392"/><line x1="200" y1="420" x2="140" y2="322"/>
  </g>

  <!-- particle cloud -->
  <g fill="#34d399">
    <circle cx="188" cy="412" r="3.5" opacity="0.9"/><circle cx="206" cy="404" r="3" opacity="0.75"/>
    <circle cx="196" cy="432" r="3.2" opacity="0.8"/><circle cx="214" cy="426" r="2.8" opacity="0.6"/>
    <circle cx="180" cy="428" r="2.6" opacity="0.55"/><circle cx="210" cy="414" r="3" opacity="0.7"/>
    <circle cx="192" cy="398" r="2.4" opacity="0.5"/><circle cx="222" cy="438" r="2.2" opacity="0.4"/>
    <circle cx="172" cy="410" r="2.2" opacity="0.42"/><circle cx="204" cy="446" r="2.4" opacity="0.45"/>
  </g>

  <!-- robot -->
  <circle cx="200" cy="420" r="20" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="3"/>
  <line x1="200" y1="420" x2="228" y2="420" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="200" cy="420" r="5" fill="#fbbf24"/>

  <!-- RRT tree -->
  <g stroke="#38bdf8" stroke-width="1.6" opacity="0.42" fill="none">
    <path d="M200 420 L262 372 L318 342"/>
    <path d="M262 372 L296 420"/>
    <path d="M200 420 L246 470 L300 462"/>
    <path d="M246 470 L268 540"/>
    <path d="M318 342 L392 336 L452 300"/>
    <path d="M392 336 L420 268"/>
    <path d="M300 462 L376 470 L442 560"/>
    <path d="M452 300 L520 288 L578 332"/>
    <path d="M442 560 L520 556"/>
    <path d="M578 332 L620 400"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="262" cy="372" r="3"/><circle cx="318" cy="342" r="3"/><circle cx="392" cy="336" r="3"/>
    <circle cx="452" cy="300" r="3"/><circle cx="520" cy="288" r="3"/><circle cx="578" cy="332" r="3"/>
    <circle cx="246" cy="470" r="3"/><circle cx="300" cy="462" r="3"/><circle cx="376" cy="470" r="3"/>
    <circle cx="442" cy="560" r="3"/><circle cx="296" cy="420" r="3"/><circle cx="420" cy="268" r="3"/>
  </g>

  <!-- smoothed path -->
  <path d="M200 420 C 300 350, 420 300, 520 292 S 610 360, 628 452" fill="none" stroke="#fbbf24" stroke-width="4.5"/>
  <text x="400" y="246" font-family="ui-monospace,monospace" font-size="19" fill="#fbbf24">shortcut-smoothed path</text>

  <!-- goal -->
  <circle cx="628" cy="452" r="15" fill="none" stroke="#34d399" stroke-width="4"/>
  <circle cx="628" cy="452" r="5" fill="#34d399"/>
  <text x="600" y="500" font-family="ui-monospace,monospace" font-size="18" fill="#34d399">goal</text>

  <!-- right panel -->
  <g font-family="ui-monospace,monospace">
    <line x1="784" y1="200" x2="784" y2="640" stroke="#243550" stroke-width="2"/>

    <text x="812" y="222" font-size="22" fill="#e2e8f0">sense → plan → act</text>

    <rect x="812" y="248" width="150" height="48" rx="8" fill="#16233a" stroke="#f472b6" stroke-width="2"/>
    <text x="836" y="278" font-size="18" fill="#f9a8d4">LIDAR</text>
    <rect x="812" y="316" width="230" height="48" rx="8" fill="#16233a" stroke="#34d399" stroke-width="2"/>
    <text x="836" y="346" font-size="18" fill="#6ee7b7">particle filter</text>
    <rect x="812" y="384" width="230" height="48" rx="8" fill="#16233a" stroke="#38bdf8" stroke-width="2"/>
    <text x="836" y="414" font-size="18" fill="#7dd3fc">RRT planner</text>
    <rect x="812" y="452" width="230" height="48" rx="8" fill="#16233a" stroke="#fbbf24" stroke-width="2"/>
    <text x="836" y="482" font-size="18" fill="#fde68a">dual-axis PID</text>

    <g stroke="#475569" stroke-width="2.5" fill="none">
      <path d="M888 296 v20"/><path d="M888 364 v20"/><path d="M888 432 v20"/>
      <path d="M1042 476 h44 v-232 h-124"/>
    </g>
    <g fill="#475569">
      <path d="M882 312 l6 10 l6 -10 z"/><path d="M882 380 l6 10 l6 -10 z"/><path d="M882 448 l6 10 l6 -10 z"/>
      <path d="M968 266 l-10 6 l10 6 z"/>
    </g>
    <text x="836" y="536" font-size="16" fill="#64748b">closed loop corrects odometry drift</text>

    <text x="812" y="590" font-size="18" fill="#94a3b8">heading θ  ·  velocity v</text>
    <text x="812" y="618" font-size="16" fill="#64748b">low-variance resampling</text>
  </g>

  <!-- footer chips -->
  <g font-family="ui-monospace,monospace" font-size="17">
    <rect x="90" y="672" width="132" height="34" rx="17" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="695" fill="#34d399">ROS / rclpy</text>
    <rect x="236" y="672" width="118" height="34" rx="17" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="256" y="695" fill="#34d399">Gazebo</text>
    <rect x="368" y="672" width="100" height="34" rx="17" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="388" y="695" fill="#34d399">RViz</text>
  </g>
</svg>
