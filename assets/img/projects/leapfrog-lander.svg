<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Leapfrog lunar lander prototype showing powered descent trajectory and landing stability envelope">
  <defs>
    <linearGradient id="lfbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a1526"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fb923c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="regolith" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3a52"/>
      <stop offset="100%" stop-color="#241f33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#lfbg)"/>

  <g fill="#e2e8f0">
    <circle cx="140" cy="180" r="1.8" opacity="0.5"/><circle cx="420" cy="110" r="2" opacity="0.55"/>
    <circle cx="760" cy="160" r="1.6" opacity="0.45"/><circle cx="1080" cy="120" r="2.1" opacity="0.6"/>
    <circle cx="980" cy="300" r="1.5" opacity="0.4"/><circle cx="230" cy="330" r="1.7" opacity="0.42"/>
  </g>

  <!-- header -->
  <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" fill="#fb923c" letter-spacing="3">USC SERC · RESEARCH</text>
  <text x="60" y="132" font-family="Georgia,serif" font-size="44" fill="#e2e8f0">Leapfrog Lunar Lander</text>
  <line x1="60" y1="158" x2="270" y2="158" stroke="#38bdf8" stroke-width="4"/>

  <!-- descent trajectory -->
  <path d="M150 232 C 300 268, 372 372, 430 470" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8" opacity="0.8"/>
  <circle cx="150" cy="232" r="7" fill="#38bdf8"/>
  <text x="118" y="212" font-family="ui-monospace,monospace" font-size="18" fill="#7dd3fc">hover</text>
  <text x="242" y="330" font-family="ui-monospace,monospace" font-size="18" fill="#7dd3fc">powered descent</text>

  <!-- regolith surface -->
  <path d="M0 640 Q 180 606 360 628 T 720 620 T 1200 636 L1200 750 L0 750 Z" fill="url(#regolith)"/>
  <ellipse cx="300" cy="672" rx="46" ry="12" fill="#1b1728" opacity="0.8"/>
  <ellipse cx="880" cy="660" rx="62" ry="15" fill="#1b1728" opacity="0.7"/>
  <ellipse cx="1080" cy="694" rx="38" ry="10" fill="#1b1728" opacity="0.6"/>

  <!-- exhaust plume -->
  <path d="M470 556 L432 700 L560 700 L522 556 Z" fill="url(#flame)"/>
  <ellipse cx="496" cy="700" rx="118" ry="26" fill="#fb923c" opacity="0.16"/>

  <!-- lander body -->
  <g>
    <path d="M424 428 h144 l22 46 v52 h-188 v-52 z" fill="#26314d" stroke="#7c8db5" stroke-width="3"/>
    <rect x="452" y="446" width="42" height="34" rx="4" fill="#0f1a2e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="506" y="446" width="42" height="34" rx="4" fill="#0f1a2e" stroke="#38bdf8" stroke-width="2"/>
    <!-- propellant tanks -->
    <circle cx="440" cy="408" r="26" fill="#33405f" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="552" cy="408" r="26" fill="#33405f" stroke="#94a3b8" stroke-width="2"/>
    <!-- engine bell -->
    <path d="M470 526 h52 l14 32 h-80 z" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- landing legs -->
  <g stroke="#94a3b8" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M420 522 L352 618"/><path d="M572 522 L640 618"/>
    <path d="M446 526 L432 618"/><path d="M546 526 L560 618"/>
  </g>
  <g fill="#64748b">
    <ellipse cx="350" cy="622" rx="19" ry="7"/><ellipse cx="642" cy="622" rx="19" ry="7"/>
    <ellipse cx="430" cy="622" rx="16" ry="6"/><ellipse cx="562" cy="622" rx="16" ry="6"/>
  </g>

  <!-- tilt / stability annotation -->
  <line x1="496" y1="380" x2="496" y2="300" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M496 340 a 56 56 0 0 1 34 12" fill="none" stroke="#f87171" stroke-width="3"/>
  <line x1="496" y1="380" x2="556" y2="316" stroke="#f87171" stroke-width="3"/>
  <text x="566" y="312" font-family="ui-monospace,monospace" font-size="21" fill="#f87171">θ tilt</text>
  <text x="404" y="290" font-family="ui-monospace,monospace" font-size="18" fill="#34d399">local vertical</text>

  <!-- right telemetry panel -->
  <g font-family="ui-monospace,monospace">
    <line x1="760" y1="212" x2="760" y2="560" stroke="#3d3550" stroke-width="2"/>
    <text x="788" y="230" font-size="22" fill="#e2e8f0">landing stability</text>

    <text x="788" y="286" font-size="18" fill="#94a3b8">thrust profile</text>
    <line x1="788" y1="386" x2="1120" y2="386" stroke="#4b4260" stroke-width="2"/>
    <path d="M788 372 L840 296 L896 302 L950 330 L1010 352 L1070 374 L1120 382" fill="none" stroke="#fb923c" stroke-width="4"/>
    <text x="1024" y="316" font-size="17" fill="#fb923c">throttle-down</text>

    <text x="788" y="452" font-size="18" fill="#94a3b8">touchdown envelope</text>
    <rect x="788" y="468" width="332" height="64" rx="8" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="806" y="496" font-size="17" fill="#34d399">vertical rate · lateral drift</text>
    <text x="806" y="520" font-size="17" fill="#34d399">tilt angle · leg load balance</text>
  </g>

  <!-- footer chips -->
  <g font-family="ui-monospace,monospace" font-size="17">
    <rect x="60" y="682" width="196" height="34" rx="17" fill="none" stroke="#fb923c" stroke-width="2"/>
    <text x="80" y="705" fill="#fb923c">test data analysis</text>
    <rect x="270" y="682" width="150" height="34" rx="17" fill="none" stroke="#fb923c" stroke-width="2"/>
    <text x="290" y="705" fill="#fb923c">propulsion</text>
    <rect x="434" y="682" width="192" height="34" rx="17" fill="none" stroke="#fb923c" stroke-width="2"/>
    <text x="454" y="705" fill="#fb923c">design iteration</text>
  </g>
</svg>
